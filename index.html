<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Place Café & Bar — Menu Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#d62d20',
                            darkRed: '#b31e13',
                            gold: '#d4af37',
                            amber: '#f39c12',
                            dark: '#1e1e1e',
                            lightBg: '#f8f9fa',
                            card: '#ffffff'
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & smooth behavior */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .banner-overlay {
            background: linear-gradient(180deg, rgba(15, 15, 15, 0.4) 0%, rgba(15, 15, 15, 0.85) 100%);
        }
        .backdrop-blur-custom {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-red selection:text-white">

    <!-- WELCOME / DINING OPTION MODAL (Modal de Boas-Vindas) -->
    <div id="welcome-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-opacity duration-300">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 text-center transform transition-transform duration-300 scale-100">
            <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-tr from-brand-red to-brand-darkRed rounded-2xl flex items-center justify-center shadow-lg shadow-brand-red/30 text-white font-extrabold text-3xl tracking-tighter border-2 border-white/20">
                S
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-1">Sweet Place</h2>
            <p class="text-sm text-gray-500 mb-6">Café & Bar — Seja muito bem-vindo!</p>
            <p class="text-base font-medium text-gray-700 mb-4">Como deseja realizar o seu pedido hoje?</p>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="setOrderType('dine-in')" class="flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-brand-red/20 bg-red-50/50 hover:bg-brand-red hover:text-white text-brand-red transition-all duration-200 group shadow-sm hover:shadow-md">
                    <i class="fa-solid font-bold fa-utensils text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="font-semibold text-sm">Comer Aqui</span>
                    <span class="text-[10px] opacity-75 mt-0.5">Servir na mesa</span>
                </button>
                <button onclick="setOrderType('takeaway')" class="flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-brand-amber/20 bg-amber-50/50 hover:bg-brand-amber hover:text-white text-brand-amber transition-all duration-200 group shadow-sm hover:shadow-md">
                    <i class="fa-solid fa-bag-shopping text-2xl mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="font-semibold text-sm">Para Levar</span>
                    <span class="text-[10px] opacity-75 mt-0.5">Retirada no balcão</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="max-w-md md:max-w-2xl lg:max-w-4xl mx-auto w-full min-h-screen bg-white shadow-2xl flex flex-col relative pb-24">

        <!-- HEADER BANNER & RESTAURANT INFO -->
        <header id="s-rest" class="relative w-full h-64 md:h-80 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1200&q=80');">
            <div class="absolute inset-0 banner-overlay flex flex-col justify-between p-5 md:p-8">
                <!-- Top Navigation Bar -->
                <div class="flex items-center justify-between">
                    <span id="dining-type-badge" class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-white text-xs font-semibold uppercase tracking-wider flex items-center gap-1.5 border border-white/30">
                        <i class="fa-solid fa-utensils text-brand-gold"></i> Comer Aqui
                    </span>
                    <button onclick="toggleOrdersModal()" class="px-3.5 py-1.5 bg-black/40 hover:bg-black/60 text-white rounded-full text-xs font-medium backdrop-blur-md transition border border-white/20 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-brand-gold"></i>
                        <span>Meus Pedidos</span>
                    </button>
                </div>

                <!-- Restaurant Brand Card -->
                <div class="flex items-end gap-4">
                    <!-- LOGO OFICIAL COM FUNDO VERMELHO VIBRANTE -->
                    <div class="w-20 h-20 md:w-24 md:h-24 bg-gradient-to-tr from-brand-red via-red-600 to-brand-darkRed rounded-2xl shadow-xl border-2 border-white/90 flex items-center justify-center shrink-0">
                        <div class="relative flex items-center justify-center">
                            <span class="text-white font-extrabold text-4xl md:text-5xl tracking-tighter drop-shadow-md">S</span>
                            <i class="fa-solid fa-utensils text-brand-gold text-xs absolute -bottom-1 -right-1 drop-shadow"></i>
                        </div>
                    </div>
                    <div class="text-white">
                        <div class="flex items-center gap-2">
                            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Sweet Place</h1>
                            <span class="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Aberto</span>
                        </div>
                        <p class="text-xs md:text-sm text-gray-200 mt-1 flex items-center gap-1">
                            <i class="fa-solid fa-martini-glass-citrus text-brand-gold"></i> Café & Bar Elegante • Especialidades & Bebidas
                        </p>
                        <div class="flex items-center gap-3 mt-2 text-xs text-gray-300">
                            <span class="flex items-center gap-1"><i class="fa-solid fa-star text-amber-400"></i> 4.8 (240+)</span>
                            <span>•</span>
                            <span class="flex items-center gap-1"><i class="fa-solid fa-location-dot text-brand-red"></i> Maputo</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- SEARCH BAR & CATEGORIES STICKY NAV -->
        <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100 p-4 space-y-3">
            <!-- Search Bar -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Buscar pratos, cocktails, bebidas..." class="w-full pl-11 pr-10 py-2.5 bg-gray-100 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-red/50 transition">
                <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- Categories Horizontal Slider -->
            <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar py-1" id="categories-container">
                <!-- Injected dynamically via JS -->
            </div>
        </div>

        <!-- PRODUCTS DISPLAY CONTAINER -->
        <main class="p-4 space-y-8 flex-1">
            <div id="products-section">
                <!-- Categorized products injected dynamically -->
            </div>
        </main>

        <!-- BOTTOM FLOATING CART BAR -->
        <div id="floating-cart" class="fixed bottom-0 left-0 right-0 z-40 p-4 max-w-md md:max-w-2xl lg:max-w-4xl mx-auto pointer-events-none">
            <button onclick="openCartDrawer()" class="pointer-events-auto w-full bg-gradient-to-r from-brand-red to-brand-darkRed hover:from-brand-darkRed hover:to-red-700 text-white rounded-2xl p-4 shadow-xl flex items-center justify-between transition-all duration-300 transform active:scale-95">
                <div class="flex items-center gap-3">
                    <div class="relative bg-white/20 p-2.5 rounded-xl">
                        <i class="fa-solid fa-basket-shopping text-lg"></i>
                        <span id="cart-badge-count" class="absolute -top-2 -right-2 bg-brand-gold text-gray-900 font-extrabold text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-brand-red">0</span>
                    </div>
                    <div class="text-left">
                        <span class="text-xs text-white/80 uppercase font-semibold block">Sua Sacola</span>
                        <span id="cart-summary-items" class="text-sm font-medium">0 itens selecionados</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="cart-summary-total" class="font-extrabold text-lg">0 MT</span>
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </div>
            </button>
        </div>

    </div>

    <!-- PRODUCT DETAIL MODAL -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col animate-slide-up">
            <div class="relative h-64 bg-gray-200 shrink-0">
                <img id="modal-product-img" src="" alt="" class="w-full h-full object-cover">
                <button onclick="closeProductModal()" class="absolute top-4 right-4 w-9 h-9 bg-black/50 hover:bg-black/70 text-white rounded-full flex items-center justify-center backdrop-blur-md transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <span id="modal-product-category" class="absolute bottom-4 left-4 px-3 py-1 bg-brand-red text-white text-xs font-semibold rounded-full shadow-md"></span>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <div>
                    <h3 id="modal-product-title" class="text-2xl font-bold text-gray-900"></h3>
                    <p id="modal-product-price" class="text-xl font-extrabold text-brand-red mt-1"></p>
                </div>
                <p id="modal-product-desc" class="text-gray-600 text-sm leading-relaxed"></p>

                <!-- Note / Observations -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Observação Especial</label>
                    <textarea id="modal-product-obs" rows="2" placeholder="Ex: Sem cebola, bem passado, gelo e limão..." class="w-full p-3 bg-gray-100 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-red/50"></textarea>
                </div>
            </div>
            
            <div class="p-4 border-t border-gray-100 bg-gray-50 flex items-center justify-between gap-4 shrink-0">
                <!-- Stepper -->
                <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-xl p-1.5 shadow-sm">
                    <button onclick="changeModalQty(-1)" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 flex items-center justify-center transition font-bold text-base">-</button>
                    <span id="modal-qty" class="font-bold text-gray-800 text-base w-6 text-center">1</span>
                    <button onclick="changeModalQty(1)" class="w-8 h-8 rounded-lg bg-brand-red hover:bg-brand-darkRed text-white flex items-center justify-center transition font-bold text-base">+</button>
                </div>

                <button id="add-to-cart-btn" onclick="addCurrentProductToCart()" class="flex-1 bg-brand-red hover:bg-brand-darkRed text-white py-3 px-4 rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cart-plus"></i>
                    <span>Adicionar • <span id="modal-total-btn-price">0 MT</span></span>
                </button>
            </div>
        </div>
    </div>

    <!-- CART SLIDING DRAWER & CHECKOUT -->
    <div id="cart-drawer" class="fixed inset-0 z-50 hidden">
        <div onclick="closeCartDrawer()" class="absolute inset-0 bg-black/60 backdrop-blur-xs transition-opacity"></div>
        
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col justify-between">
                <!-- Header -->
                <div class="p-4 bg-brand-dark text-white flex items-center justify-between shadow-md">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bag-shopping text-brand-gold text-xl"></i>
                        <h2 class="font-bold text-lg">Sua Sacola de Pedidos</h2>
                    </div>
                    <button onclick="closeCartDrawer()" class="text-gray-400 hover:text-white p-1">
                        <i class="fa-solid fa-xmark text-2xl"></i>
                    </button>
                </div>

                <!-- Items List -->
                <div id="cart-drawer-items" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-gray-100">
                    <!-- Dynamic cart items injected here -->
                </div>

                <!-- Checkout Form & Footer -->
                <div class="p-4 bg-gray-50 border-t border-gray-200 space-y-4">
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>Subtotal</span>
                            <span id="drawer-subtotal">0 MT</span>
                        </div>
                        <div class="flex justify-between text-base font-extrabold text-gray-900 border-t border-gray-200 pt-2">
                            <span>Total Geral</span>
                            <span id="drawer-total" class="text-brand-red">0 MT</span>
                        </div>
                    </div>

                    <!-- Customer Form -->
                    <div class="space-y-2.5 pt-2 border-t border-gray-200">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Seu Nome *</label>
                            <input type="text" id="customer-name" placeholder="Digite seu nome..." class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-red/50">
                        </div>

                        <div id="table-number-container">
                            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Número da Mesa *</label>
                            <input type="number" id="customer-table" placeholder="Ex: 05" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-red/50">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Observação do Pedido</label>
                            <input type="text" id="order-notes" placeholder="Ex: Trazer guardanapos extras..." class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-red/50">
                        </div>
                    </div>

                    <button onclick="submitOrderToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 transition transform active:scale-98">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span>Enviar Pedido via WhatsApp</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ORDERS HISTORY MODAL (Meus Pedidos) -->
    <div id="orders-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            <div class="p-4 bg-gray-900 text-white flex items-center justify-between">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-brand-gold"></i> Meus Pedidos
                </h3>
                <button onclick="toggleOrdersModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="orders-list-container" class="p-4 overflow-y-auto space-y-4 flex-1">
                <!-- Orders injected dynamically -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ==========================================================================
           MENU REAL SWEET PLACE — 289 produtos / 38 subcategorias
           Fonte: "Sweet Place — Menu Digital.html".
           Imagens: 1 foto Unsplash curada por subcategoria (itens da mesma

            'carnes':         'https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=800&q=80',

            'lata':           'https://images.unsplash.com/photo-1618885472179-5e474019f2a9?auto=format&fit=crop&w=800&q=80',
            'sem-alcool':     'https://images.unsplash.com/photo-1608270586620-248524c67de9?auto=format&fit=crop&w=800&q=80',
            'cidras':         'https://images.unsplash.com/photo-1566633806327-68e152aaf26d?auto=format&fit=crop&w=800&q=80',
            'sangria':        'https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=800&q=80',

        /* Estrutura compacta por subcategoria: itens [nome, preço, descrição?] */

            /* ---------- COMIDA ---------- */
            { id: 'pequeno-almoco', g: 'comida', gName: 'Comida', n: 'Pequenos Almoços', items: [

        function groupBySubCategory(items) {
            const map = {}, order = [];
            items.forEach(p => {
                if (!map[p.subCategory]) { map[p.subCategory] = []; order.push(p.subCategory); }
                map[p.subCategory].push(p);
            });
            return order.map(name => ({ name, items: map[name], note: map[name][0].note }));
        }

            const container = document.getElementById('products-section');
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

            let filtered = PRODUCTS_DATABASE.filter(prod => {

                const matchesSearch = prod.name.toLowerCase().includes(searchQuery)

                return matchesCategory && matchesSearch;
            });

                // Vista "Todos": secção por categoria com sub-títulos por subcategoria
                CATEGORIES.filter(c => c.id !== 'todos').forEach(cat => {
                    const items = filtered.filter(p => p.categoryId === cat.id);
                    if (!items.length) return;
                    html += `
                        <div class="space-y-5">
                            <h2 class="text-lg font-bold text-gray-900 border-l-4 border-brand-red pl-3 flex items-center justify-between">
                                <span>${cat.name}</span>
                                <span class="text-xs font-normal text-gray-400">${items.length} itens</span>
                            </h2>
                            ${groupBySubCategory(items).map(sub => `
                                <div class="pt-1">
                                    <h3 class="text-sm font-bold text-gray-800 border-l-2 border-brand-gold pl-2.5 flex items-center justify-between mb-3">
                                        <span>${sub.name}</span>
                                        <span class="text-xs font-normal text-gray-400">${sub.items.length} itens</span>
                                    </h3>
                                    ${noteHTML(sub.note)}
                                    ${cardsHTML(sub.items)}
                                </div>
                            `).join('')}
                        </div>`;
                });
            } else {
                // Categoria selecionada: subcategorias como títulos principais
                html = groupBySubCategory(filtered).map(sub => `
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-gray-900 border-l-4 border-brand-red pl-3 flex items-center justify-between">
                            <span>${sub.name}</span>
                            <span class="text-xs font-normal text-gray-400">${sub.items.length} itens</span>
                        </h2>
                        ${noteHTML(sub.note)}
                        ${cardsHTML(sub.items)}
                    </div>`).join('');
            }

            container.innerHTML = `<div class="space-y-10">${html}</div>`;
        }

        function createProductCardHTML(product) {
            return `
                <div onclick="openProductModal('${product.id}')" class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer flex gap-3.5 group">
                    <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-xl overflow-hidden bg-gray-100 relative shrink-0">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80'">
                    </div>
                    <div class="flex flex-col justify-between flex-1 py-0.5">
                        <div>
                            <h3 class="font-bold text-gray-900 text-sm leading-snug group-hover:text-brand-red transition">${product.name}</h3>
                            <p class="text-gray-500 text-xs line-clamp-2 mt-1 leading-normal">${product.description}</p>
                        </div>
                        <div class="flex items-center justify-between mt-2">
                            <span class="font-extrabold text-brand-red text-base">${product.price} MT</span>
                            <button class="w-8 h-8 bg-red-50 text-brand-red rounded-lg flex items-center justify-center font-bold group-hover:bg-brand-red group-hover:text-white transition">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ==========================================================================
           SEARCH FILTER
           ========================================================================== */
        function filterProducts() {
            const query = document.getElementById('search-input').value.trim();
            const clearBtn = document.getElementById('clear-search');
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderProducts();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            renderProducts();
        }

        /* ==========================================================================
           PRODUCT DETAIL MODAL LOGIC
           ========================================================================== */
        function openProductModal(productId) {
            const product = PRODUCTS_DATABASE.find(p => p.id === productId);
            if (!product) return;

            selectedProductForModal = product;
            currentModalQty = 1;

            document.getElementById('modal-product-img').src = product.image;
            document.getElementById('modal-product-title').innerText = product.name;
            document.getElementById('modal-product-price').innerText = product.price + ' MT';
            document.getElementById('modal-product-desc').innerText = product.description;
            document.getElementById('modal-product-category').innerText = product.categoryName;
            document.getElementById('modal-product-obs').value = '';
            
            updateModalPriceDisplay();

            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
            selectedProductForModal = null;
        }

        function changeModalQty(delta) {
            currentModalQty = Math.max(1, currentModalQty + delta);
            updateModalPriceDisplay();
        }

        function updateModalPriceDisplay() {
            document.getElementById('modal-qty').innerText = currentModalQty;
            if (selectedProductForModal) {
                const total = selectedProductForModal.price * currentModalQty;
                document.getElementById('modal-total-btn-price').innerText = total + ' MT';
            }
        }

        function addCurrentProductToCart() {
            if (!selectedProductForModal) return;

            const obs = document.getElementById('modal-product-obs').value.trim();
            const existingIndex = cart.findIndex(item => item.product.id === selectedProductForModal.id && item.obs === obs);

            if (existingIndex > -1) {
                cart[existingIndex].quantity += currentModalQty;
            } else {
                cart.push({
                    product: selectedProductForModal,
                    quantity: currentModalQty,
                    obs: obs
                });
            }

            closeProductModal();
            updateCartSummary();
        }

        /* ==========================================================================
           CART DRAWER & STATE
           ========================================================================== */
        function updateCartSummary() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

            document.getElementById('cart-badge-count').innerText = totalCount;
            document.getElementById('cart-summary-items').innerText = `${totalCount} ${totalCount === 1 ? 'item' : 'itens'} selecionados`;
            document.getElementById('cart-summary-total').innerText = totalPrice + ' MT';

            document.getElementById('drawer-subtotal').innerText = totalPrice + ' MT';
            document.getElementById('drawer-total').innerText = totalPrice + ' MT';

            renderCartDrawerItems();
        }

        function openCartDrawer() {
            if (cart.length === 0) {
                alert("Sua sacola está vazia. Adicione alguns pratos ou bebidas primeiro!");
                return;
            }
            document.getElementById('cart-drawer').classList.remove('hidden');
        }

        function closeCartDrawer() {
            document.getElementById('cart-drawer').classList.add('hidden');
        }

        function renderCartDrawerItems() {
            const container = document.getElementById('cart-drawer-items');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-2"></i>
                        <p class="text-sm">A sua sacola está vazia.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="py-3 flex items-center justify-between gap-3">
                    <img src="${item.product.image}" class="w-14 h-14 rounded-xl object-cover shrink-0">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-900 text-xs truncate">${item.product.name}</h4>
                        <p class="text-brand-red font-semibold text-xs">${item.product.price} MT</p>
                        ${item.obs ? `<p class="text-[10px] text-gray-500 italic truncate">Obs: ${item.obs}</p>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center border border-gray-200 rounded-lg bg-gray-50">
                            <button onclick="updateCartItemQty(${index}, -1)" class="w-6 h-6 text-xs text-gray-600 font-bold hover:bg-gray-200 rounded-l">-</button>
                            <span class="w-6 text-center text-xs font-bold text-gray-800">${item.quantity}</span>
                            <button onclick="updateCartItemQty(${index}, 1)" class="w-6 h-6 text-xs text-gray-600 font-bold hover:bg-gray-200 rounded-r">+</button>
                        </div>
                        <button onclick="removeCartItem(${index})" class="text-gray-400 hover:text-red-500 text-xs p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateCartItemQty(index, delta) {
            if (cart[index]) {
                cart[index].quantity += delta;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
                updateCartSummary();
            }
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartSummary();
            if (cart.length === 0) {
                closeCartDrawer();
            }
        }

        /* ==========================================================================
           WHATSAPP SUBMISSION & MEUS PEDIDOS
           ========================================================================== */
        function submitOrderToWhatsApp() {
            const name = document.getElementById('customer-name').value.trim();
            const table = document.getElementById('customer-table').value.trim();
            const notes = document.getElementById('order-notes').value.trim();

            if (!name) {
                alert("Por favor, preencha o seu nome.");
                return;
            }

            if (currentOrderType === 'dine-in' && !table) {
                alert("Por favor, informe o número da sua mesa.");
                return;
            }

            if (cart.length === 0) {
                alert("A sua sacola está vazia.");
                return;
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            const orderId = '#' + Math.floor(1000 + Math.random() * 9000);

            let message = `*NOVO PEDIDO - SWEET PLACE* 🍹🍽️\n`;
            message += `*Pedido:* ${orderId}\n`;
            message += `*Cliente:* ${name}\n`;
            message += `*Tipo:* ${currentOrderType === 'dine-in' ? `Comer Aqui (Mesa ${table})` : 'Para Levar (Retirada)'}\n`;
            message += `-----------------------------------\n`;
            message += `*ITENS DO PEDIDO:*\n`;

            cart.forEach(item => {
                message += `• ${item.quantity}x ${item.product.name} - ${item.product.price * item.quantity} MT\n`;
                if (item.obs) {
                    message += `   _Obs: ${item.obs}_\n`;
                }
            });

            message += `-----------------------------------\n`;
            if (notes) {
                message += `*Observação Geral:* ${notes}\n`;
            }
            message += `*TOTAL:* *${totalPrice} MT*\n\n`;
            message += `Obrigado por escolher o Sweet Place!`;

            // Save order locally for history tracking
            const newOrderRecord = {
                id: orderId,
                date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                items: [...cart],
                total: totalPrice,
                type: currentOrderType === 'dine-in' ? `Mesa ${table}` : 'Para Levar',
                status: 'Em Preparo'
            };

            myOrdersHistory.unshift(newOrderRecord);
            localStorage.setItem('sweet_place_orders', JSON.stringify(myOrdersHistory));

            // Reset cart
            cart = [];
            updateCartSummary();
            closeCartDrawer();

            // WhatsApp Redirect
            const phoneNumber = "258878390030";
            const encodedUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(encodedUrl, '_blank');
        }

        function toggleOrdersModal() {
            const modal = document.getElementById('orders-modal');
            const container = document.getElementById('orders-list-container');

            if (modal.classList.contains('hidden')) {
                if (myOrdersHistory.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-10 text-gray-400">
                            <i class="fa-solid fa-receipt text-4xl mb-2"></i>
                            <p class="text-sm">Nenhum pedido realizado recentemente.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = myOrdersHistory.map(ord => `
                        <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4 space-y-2">
                            <div class="flex items-center justify-between border-b border-gray-200 pb-2">
                                <div>
                                    <span class="font-extrabold text-gray-900 text-sm">${ord.id}</span>
                                    <span class="text-xs text-gray-400 ml-2">${ord.date}</span>
                                </div>
                                <span class="px-2.5 py-0.5 text-[10px] font-bold uppercase rounded-full bg-amber-100 text-amber-700">
                                    ${ord.status}
                                </span>
                            </div>
                            <div class="text-xs space-y-1 text-gray-600">
                                ${ord.items.map(i => `<div>• ${i.quantity}x ${i.product.name}</div>`).join('')}
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t border-gray-200 font-bold text-xs">
                                <span class="text-gray-500">${ord.type}</span>
                                <span class="text-brand-red text-sm">${ord.total} MT</span>
                            </div>
                        </div>
                    `).join('');
                }
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
